<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Floot Driver - Cancel Button Restored</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#F5F3FF}
body{font-family:Inter,-apple-system,sans-serif}
.app{position:relative;width:100%;height:100dvh;max-width:480px;margin:0 auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
#poolMap{position:absolute;inset:0;z-index:1;width:100%;height:100%}
.bolt-header{position:absolute;top:0;left:0;right:0;z-index:10;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.bolt-header > *{pointer-events:auto}
.profile-pill{background:#fff;border-radius:999px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);border:1px solid #F3F0FF}
.avatar{width:32px;height:32px;border-radius:50%;background:#7C3AED;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid #F3F0FF;box-shadow:0 4px 20px rgba(0,0,0,.12);display:grid;place-items:center;cursor:pointer}
.bottom-sheet{position:absolute;bottom:0;left:0;right:0;z-index:20;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.14);max-height:86dvh;display:flex;flex-direction:column}
.sheet-handle{width:36px;height:4px;background:#E9E5FF;border-radius:999px;margin:12px auto 0}
.sheet-tabs{display:flex;gap:6px;padding:12px 12px 10px;background:#fff;border-radius:28px 28px 0 0;overflow-x:auto}
.sheet-tab{flex:1;min-width:70px;padding:12px 6px;border-radius:999px;border:none;font-weight:800;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.sheet-tab.active{background:#7C3AED;color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.3)}
.sheet-tab:not(.active){background:#F5F3FF;color:#6B7280}
.badge{background:#fff;color:#7C3AED;padding:2px 6px;border-radius:999px;font-size:10px;font-weight:900;margin-left:3px;min-width:18px;text-align:center}
.sheet-content{overflow-y:auto;padding:0 14px 20px;flex:1}
.bolt-input-group{position:relative;margin-bottom:12px}
.bolt-input{width:100%;background:#F8F7FF;border:1.5px solid #EDE9FE;border-radius:16px;padding:16px 16px 16px 48px;font-size:14px;font-weight:600;outline:none;color:#1F1A2E}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px}
.icon-from{background:#ECFDF5;color:#10B981}
.icon-to{background:#FEF2F2;color:#EF4444}
.icon-seat{background:#F5F3FF;color:#7C3AED}
.route-line{position:absolute;left:29px;top:42px;bottom:-8px;width:2px;background:repeating-linear-gradient(to bottom,#EDE9FE 0 6px,transparent 6px 12px);z-index:0}
.bolt-card{background:#F8F7FF;border:1px solid #EDE9FE;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.bolt-btn{width:100%;border:none;border-radius:16px;padding:16px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.bolt-btn-primary{background:#7C3AED;color:#fff;box-shadow:0 8px 20px rgba(124,58,237,.25)}
.rider-card-exact{background:#fff;border:2px solid #7C3AED;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(124,58,237,.08)}
.rider-card-accepted{background:#fff;border:2px solid #10B981;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(16,185,129,.08)}
.rider-card-picked{background:#fff;border:2px solid #F59E0B;border-radius:20px;padding:16px;margin-bottom:12px}
.trip-card-active{background:#fff;border:2px solid #7C3AED;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(124,58,237,.15)}
.trip-card-full{background:#fff;border:2px solid #EF4444;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(239,68,68,.12)}
.history-card{background:#fff;border:1.5px solid #E5E7EB;border-radius:16px;padding:14px;margin-bottom:10px;opacity:.9}
.otp-hidden{background:#1F1A2E;color:#fff;border-radius:14px;padding:12px;text-align:center;flex:1;border:2px dashed #4B5563}
.otp-hidden-yellow{background:#FFFBEB;color:#92400E;border-radius:14px;padding:12px;text-align:center;flex:1;border:2px dashed #FCD34D}
.collect-box{background:#ECFDF5;color:#065F46;border-radius:14px;padding:12px;text-align:center;flex:1;border:2px solid #A7F3D0}
.accept-btn{background:#7C3AED;color:#fff;border:none;border-radius:999px;padding:14px;font-weight:800;font-size:14px;flex:1;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.call-btn{background:#F5F3FF;color:#7C3AED;border:none;border-radius:999px;padding:14px;flex:1;cursor:pointer;display:grid;place-items:center}
.decline-btn{background:#FFF1F2;color:#BE123C;border:none;border-radius:999px;padding:14px;flex:1;cursor:pointer;display:grid;place-items:center}
.cancel-trip-btn{background:#FFF1F2;color:#BE123C;border:1.5px solid #FFE4E6;border-radius:999px;padding:12px;font-weight:800;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.label{font-size:10px;font-weight:800;letter-spacing:.08em;color:#8B8BA7;margin-bottom:6px;text-transform:uppercase}
.small{font-size:11px;color:#6B7280}
.suggest{position:absolute;left:0;right:0;top:56px;background:#fff;border:1.5px solid #EDE9FE;border-radius:16px;z-index:50;max-height:180px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.15);display:none}
.suggest div{padding:12px 14px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:1px solid #F5F3FF}
.uber-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);z-index:9999;display:none;align-items:flex-end;justify-content:center}
.uber-overlay.show{display:flex}
.uber-popup{width:100%;max-width:480px;background:#fff;border-radius:28px 28px 0 0;max-height:92dvh;display:flex;flex-direction:column;animation:slideUp .35s cubic-bezier(.32,.72,0,1);overflow:hidden}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.uber-header{background:#1F1A2E;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.uber-map-preview{width:100%;height:160px;background:#F5F3FF;position:relative;overflow:hidden}
.pulse-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:#7C3AED;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 8px rgba(124,58,237,.2);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,58,237,.6)}70%{box-shadow:0 0 0 18px rgba(124,58,237,0)}100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}}
.uber-body{padding:20px;overflow-y:auto;flex:1}
.countdown-ring{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.notification{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1F1A2E;color:#fff;padding:14px 18px;border-radius:16px;z-index:10000;display:none;max-width:90%;font-size:13px;font-weight:600;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.notification.show{display:flex}
.auth-bg{background:#fff;min-height:100dvh;display:flex;flex-direction:column;padding:0;position:fixed;inset:0;z-index:10000}
.auth-top{height:42dvh;background:linear-gradient(180deg,#7C3AED 0%, #5B21B6 100%);border-radius:0 0 32px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.auth-card{flex:1;background:#fff;margin-top:-24px;border-radius:32px 32px 0 0;padding:24px 20px 20px;box-shadow:0 -8px 30px rgba(0,0,0,.08);overflow-y:auto}
.end-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:10001;display:none;align-items:center;justify-content:center;padding:20px}
.end-overlay.show{display:flex}
.end-modal{width:100%;max-width:360px;background:#fff;border-radius:24px;padding:24px;text-align:center;animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
