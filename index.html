<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Floot Driver - Working</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:Inter,sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#FAF7FF}
.card{background:#fff;border:1px solid #F3F0FF;border-radius:20px;padding:16px;margin:12px}
.input{width:100%;background:#F5F3FF;border:1px solid #EDE9FE;border-radius:14px;padding:14px 14px 14px 42px;font-size:14px;outline:none}
.input-wrap{position:relative;margin-bottom:10px}
.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#A78BFA}
.btn{width:100%;border:none;border-radius:14px;padding:14px;font-weight:800;cursor:pointer}
.btn-primary{background:#7C3AED;color:#fff}
.btn-ghost{background:#F5F3FF;color:#7C3AED;border:1px solid #EDE9FE;margin-top:8px}
#poolMap{width:100%;height:380px;border-radius:16px;z-index:1;background:#eee}
.suggest{position:absolute;left:0;right:0;top:44px;background:#fff;border:1px solid #EDE9FE;border-radius:12px;z-index:30;max-height:180px;overflow:auto;display:none}
.suggest div{padding:10px;font-size:12px;border-bottom:1px solid #F5F3FF;cursor:pointer}
.order{background:#FAF7FF;border:1px solid #EDE9FE;border-radius:14px;padding:12px;margin-bottom:8px}
.small{font-size:11px;color:#6B7280}
.label{font-size:10px;font-weight:800;color:#8B8BA7;margin-bottom:8px}
.tabs{display:flex;background:#F5F3FF;border-radius:10px;padding:4px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:8px;text-align:center;font-weight:800;font-size:12px;cursor:pointer}
.tab.active{background:#fff;color:#7C3AED}
.auth-bg{background:linear-gradient(180deg,#7C3AED 0%, #5B21B6 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:fixed;inset:0;z-index:10000}
.auth-card{width:100%;max-width:360px;background:#fff;border-radius:24px;padding:20px}
.errorBox{background:#FFF1F2;color:#BE123C;padding:10px;border-radius:10px;font-size:11px;margin-top:8px;white-space:pre-wrap;display:none}
.successBox{background:#F0FDF4;color:#15803D;padding:10px;border-radius:10px;font-size:11px;margin-top:8px;white-space:pre-wrap;display:none}
</style>
</head>
<body>

<div id="authScreen" class="auth-bg">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:16px"><div style="width:50px;height:50px;border-radius:12px;background:#7C3AED;display:grid;place-items:center;margin:0 auto;color:#fff;font-size:20px"><i class="fa-solid fa-car"></i></div><div style="font-weight:900;margin-top:8px">FLOOT DRIVER</div><div style="font-size:11px;color:#6B7280">Email + Password Only</div></div>
    <div class="tabs"><div id="loginTab" class="tab active">Login</div><div id="regTab" class="tab">Register</div></div>
    <div id="loginForm">
      <div class="input-wrap"><i class="fa-solid fa-envelope"></i><input id="loginEmail" class="input" type="email" placeholder="Email - e.g. flootinitiative@gmail.com"></div>
      <div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="loginPass" class="input" type="password" placeholder="Password"></div>
      <button id="loginBtn" class="btn btn-primary">LOGIN</button>
      <div id="loginMsg" class="small" style="text-align:center;margin-top:8px"></div>
      <div id="loginError" class="errorBox"></div>
    </div>
    <div id="regForm" style="display:none">
      <div class="input-wrap"><i class="fa-solid fa-user"></i><input id="regName" class="input" placeholder="Full Name *"></div>
      <div class="input-wrap"><i class="fa-solid fa-phone"></i><input id="regPhone" class="input" placeholder="Phone *"></div>
      <div class="input-wrap"><i class="fa-solid fa-envelope"></i><input id="regEmail" class="input" type="email" placeholder="Email *"></div>
      <div class="input-wrap"><i class="fa-solid fa-car"></i><input id="regVehicle" class="input" placeholder="Car / Jeep / Sedan *"></div>
      <div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="regPass" class="input" type="password" placeholder="Password *"></div>
      <button id="regBtn" class="btn btn-primary">CREATE ACCOUNT</button>
      <div id="regMsg" class="small" style="text-align:center;margin-top:8px"></div>
      <div id="regError" class="errorBox"></div>
    </div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none">
  <div style="padding:14px 16px;background:#fff;border-bottom:1px solid #F3F0FF;display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:800" id="driverName">Driver</div><div class="small" id="driverEmail">...</div></div><button id="logoutBtn" style="width:32px;height:32px;border-radius:8px;border:1px solid #F3F0FF;background:#fff">X</button></div>

  <div style="padding:10px 16px;display:flex;gap:6px"><button id="btnCreate" style="flex:1;padding:10px;border-radius:10px;border:none;background:#7C3AED;color:#fff;font-weight:800">CREATE POOL</button><button id="btnTrips" style="flex:1;padding:10px;border-radius:10px;border:none;background:#F5F3FF;color:#6B7280;font-weight:800">MY TRIPS</button></div>

  <div id="createSection">
    <div class="card">
      <div class="label">CREATE POOL - ALL NIGERIA</div>
      <div style="position:relative"><div class="input-wrap"><i class="fa-solid fa-location-dot" style="color:#10B981"></i><input id="fromInput" class="input" placeholder="From - Lagos"></div><div id="fromSug" class="suggest"></div></div>
      <div style="position:relative"><div class="input-wrap"><i class="fa-solid fa-flag-checkered" style="color:#EF4444"></i><input id="toInput" class="input" placeholder="To - Adamawa State"></div><div id="toSug" class="suggest"></div></div>
      <div class="input-wrap"><i class="fa-solid fa-chair"></i><input id="seatsInput" class="input" type="number" value="6"></div>
      <div style="margin:10px 0"><div id="poolMap"></div><div id="routeInfo" style="margin-top:8px;background:#F5F3FF;padding:10px;border-radius:10px;display:none"><span id="routeDistance" style="font-weight:800">0 km</span> <span id="routeLabel" style="font-size:12px">route</span></div></div>
      <button id="createPoolBtn" class="btn btn-primary">CREATE POOL TRIP</button>
      <div id="createMsg" class="small" style="text-align:center;margin-top:8px"></div>
      <div id="createError" class="errorBox"></div>
      <div id="createSuccess" class="successBox"></div>
    </div>
  </div>

  <div id="tripsSection" style="display:none">
    <div class="card"><div class="label">MY TRIPS</div><div id="myTripsBox" class="small">No trips</div></div>
    <div class="card"><div class="label">RIDER REQUESTS</div><div id="riderBox" class="small">No riders</div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, limit, onSnapshot, doc, getDoc, addDoc, updateDoc, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyBVIJq5napb_egiLdKhGtySZoPeLUkY9Q4", authDomain: "floot-delivery.firebaseapp.com", projectId: "floot-delivery", storageBucket: "floot-delivery.firebasestorage.app", messagingSenderId: "786230599434", appId: "1:786230599434:web:e1913bd8c2e69a7e1c64f3" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentDriver=null, poolMap=null, fromMarker=null, toMarker=null, routeLine=null, fromCoord=null, toCoord=null;
const CENTER=[9.0820,8.6753];

function showError(id, msg){ const el=document.getElementById(id); el.style.display="block"; el.textContent=msg; }
function showSuccess(id, msg){ const el=document.getElementById(id); el.style.display="block"; el.textContent=msg; }
function hideBoxes(){ document.querySelectorAll(".errorBox,.successBox").forEach(e=>e.style.display="none"); }

const saved=JSON.parse(localStorage.getItem("floot_driver_session")||"null");
if(saved){ loginOK(saved); }
function loginOK(driver){
  if(!driver.vehicle) driver.vehicle="Car";
  currentDriver=driver;
  document.getElementById("authScreen").style.display="none";
  document.getElementById("mainApp").style.display="block";
  document.getElementById("driverName").textContent=driver.name;
  document.getElementById("driverEmail").textContent=driver.email+" • "+(driver.vehicle||"Car");
  setTimeout(()=>{ initMap(); startListeners(); },300);
}

document.getElementById("loginTab").onclick=()=>{ document.getElementById("loginTab").classList.add("active"); document.getElementById("regTab").classList.remove("active"); document.getElementById("loginForm").style.display="block"; document.getElementById("regForm").style.display="none"; hideBoxes(); };
document.getElementById("regTab").onclick=()=>{ document.getElementById("regTab").classList.add("active"); document.getElementById("loginTab").classList.remove("active"); document.getElementById("loginForm").style.display="none"; document.getElementById("regForm").style.display="block"; hideBoxes(); };

document.getElementById("regBtn").onclick=async()=>{
  hideBoxes();
  const name=document.getElementById("regName").value.trim(), phone=document.getElementById("regPhone").value.trim(), email=document.getElementById("regEmail").value.trim().toLowerCase(), vehicle=document.getElementById("regVehicle").value.trim()||"Car", pass=document.getElementById("regPass").value.trim(), msg=document.getElementById("regMsg");
  if(!name||!phone||!email||!pass){ msg.textContent="Fill all"; return; }
  const id=email.replace(/[^a-z0-9]/g,"_");
  const profile={id,name,phone,email,vehicle,vehicleType:"Car",plateNumber:"",password:pass,createdAt:new Date().toISOString()};
  msg.textContent="Creating...";
  try{
    const ex=await getDoc(doc(db,"drivers",id));
    if(ex.exists()){ msg.textContent="Email exists, login"; return; }
    await setDoc(doc(db,"drivers",id),profile);
    localStorage.setItem("floot_driver_session",JSON.stringify(profile));
    msg.textContent="Created!"; loginOK(profile);
  }catch(e){ msg.textContent="Failed"; showError("regError", e.message+"\n\nFirestore Rules must allow write. Go to Firebase Console > Firestore > Rules > set: allow read, write: if true;"); }
};

document.getElementById("loginBtn").onclick=async()=>{
  hideBoxes();
  const email=document.getElementById("loginEmail").value.trim().toLowerCase(), pass=document.getElementById("loginPass").value.trim(), msg=document.getElementById("loginMsg");
  if(!email||!pass){ msg.textContent="Enter email & pass"; return; }
  msg.textContent="Logging in...";
  try{
    const id=email.replace(/[^a-z0-9]/g,"_");
    let snap=await getDoc(doc(db,"drivers",id));
    let profile=null;
    if(snap.exists()) profile=snap.data();
    else{
      const q=query(collection(db,"drivers"),where("email","==",email),limit(1));
      const qs=await getDocs(q);
      if(!qs.empty) profile=qs.docs[0].data();
    }
    if(!profile){ msg.textContent="No account"; return; }
    if(profile.password!==pass){ msg.textContent="Wrong password"; return; }
    if(!profile.vehicle) profile.vehicle="Car";
    localStorage.setItem("floot_driver_session",JSON.stringify(profile));
    msg.textContent="Success!"; loginOK(profile);
  }catch(e){ msg.textContent="Failed"; showError("loginError", e.message); }
};

document.getElementById("logoutBtn").onclick=()=>{ localStorage.removeItem("floot_driver_session"); location.reload(); };
document.getElementById("btnCreate").onclick=()=>{ document.getElementById("createSection").style.display="block"; document.getElementById("tripsSection").style.display="none"; setTimeout(()=>{poolMap&&poolMap.invalidateSize();},200); };
document.getElementById("btnTrips").onclick=()=>{ document.getElementById("createSection").style.display="none"; document.getElementById("tripsSection").style.display="block"; };

function initMap(){ if(!poolMap){ poolMap=L.map('poolMap',{zoomControl:true}).setView(CENTER,6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(poolMap); } }
function haversine(a,b){ const R=6371; const dLat=(b.lat-a.lat)*Math.PI/180; const dLng=(b.lng-a.lng)*Math.PI/180; const lat1=a.lat*Math.PI/180, lat2=b.lat*Math.PI/180; const x=Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
async function geocode(addr){ try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=ng&q=${encodeURIComponent(addr)}&limit=1`); const j=await r.json(); if(j[0]) return {lat:+j[0].lat,lng:+j[0].lon}; const r2=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr+', Nigeria')}&limit=1`); const j2=await r2.json(); if(j2[0]) return {lat:+j2[0].lat,lng:+j2[0].lon}; }catch{} return null; }
function attach(inputId,sugId,setter){
  const input=document.getElementById(inputId), sug=document.getElementById(sugId); let t=null;
  input.addEventListener("input",()=>{ clearTimeout(t); const v=input.value.trim(); if(v.length<2){sug.style.display="none";return;} t=setTimeout(async()=>{ try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=ng&q=${encodeURIComponent(v)}&limit=6`); const j=await r.json(); if(j.length===0){sug.style.display="none";return;} sug.innerHTML=j.map(o=>`<div data-lat="${o.lat}" data-lon="${o.lon}" data-name="${o.display_name.replace(/"/g,'&quot;')}">${o.display_name}</div>`).join(""); sug.style.display="block"; sug.querySelectorAll("div").forEach(el=>{ el.onclick=()=>{ input.value=el.getAttribute("data-name"); setter({lat:+el.getAttribute("data-lat"),lng:+el.getAttribute("data-lon")}); sug.style.display="none"; updateRoute(); }; }); }catch{} },300); });
  document.addEventListener("click",(e)=>{ if(!sug.contains(e.target)&&e.target!==input) sug.style.display="none"; });
}
attach("fromInput","fromSug",c=>fromCoord=c); attach("toInput","toSug",c=>toCoord=c);

async function updateRoute(){
  if(!fromCoord) fromCoord=await geocode(document.getElementById("fromInput").value);
  if(!toCoord) toCoord=await geocode(document.getElementById("toInput").value);
  if(!fromCoord||!toCoord) return;
  if(!poolMap) initMap();
  if(fromMarker) poolMap.removeLayer(fromMarker); if(toMarker) poolMap.removeLayer(toMarker); if(routeLine) poolMap.removeLayer(routeLine);
  fromMarker=L.marker([fromCoord.lat,fromCoord.lng]).addTo(poolMap); toMarker=L.marker([toCoord.lat,toCoord.lng]).addTo(poolMap);
  routeLine=L.polyline([[fromCoord.lat,fromCoord.lng],[toCoord.lat,toCoord.lng]],{color:'#7C3AED',weight:5}).addTo(poolMap);
  poolMap.fitBounds(L.latLngBounds([[fromCoord.lat,fromCoord.lng],[toCoord.lat,toCoord.lng]]),{padding:[50,50]});
  const km=haversine(fromCoord,toCoord);
  document.getElementById("routeInfo").style.display="block"; document.getElementById("routeDistance").textContent=km.toFixed(1)+" km"; document.getElementById("routeLabel").textContent=document.getElementById("fromInput").value+" → "+document.getElementById("toInput").value;
  document.getElementById("createPoolBtn").dataset.km=km;
}
document.getElementById("fromInput").addEventListener("change",updateRoute); document.getElementById("toInput").addEventListener("change",updateRoute);

document.getElementById("createPoolBtn").onclick=async()=>{
  hideBoxes();
  const from=document.getElementById("fromInput").value.trim(), to=document.getElementById("toInput").value.trim(), seats=parseInt(document.getElementById("seatsInput").value)||6, msg=document.getElementById("createMsg");
  if(!currentDriver){ msg.textContent="Login first"; return; }
  if(!from||!to){ msg.textContent="Enter From & To"; return; }
  if(!fromCoord) fromCoord=await geocode(from); if(!toCoord) toCoord=await geocode(to);
  if(!fromCoord||!toCoord){ msg.textContent="Select from dropdown"; return; }
  const km=parseFloat(document.getElementById("createPoolBtn").dataset.km)||haversine(fromCoord,toCoord);
  msg.textContent="Creating...";

  const payload={
    from: from,
    to: to,
    pickup: from,
    dropoff: to,
    fromLat: Number(fromCoord.lat),
    fromLng: Number(fromCoord.lng),
    toLat: Number(toCoord.lat),
    toLng: Number(toCoord.lng),
    distance: Number(km),
    driverId: String(currentDriver.id||""),
    driverName: String(currentDriver.name||"Driver"),
    driverPhone: String(currentDriver.phone||""),
    driverEmail: String(currentDriver.email||""),
    vehicle: String(currentDriver.vehicle||"Car"),
    vehicleType: "Car",
    plateNumber: "",
    status: "open",
    totalSeats: Number(seats),
    joinedCount: 0,
    totalCollected: 0,
    createdAt: new Date().toISOString(),
    country: "Nigeria"
  };

  console.log("Creating pool with payload:", payload);

  try{
    const ref=await addDoc(collection(db,"pool_trips"),payload);
    msg.textContent=""; showSuccess("createSuccess", "✓ Pool created! ID: "+ref.id+"\n"+from+" → "+to+"\n"+km.toFixed(1)+"km - Customers can now see it in customer app!");
    document.getElementById("fromInput").value=""; document.getElementById("toInput").value=""; fromCoord=null; toCoord=null;
    if(fromMarker) poolMap.removeLayer(fromMarker); if(toMarker) poolMap.removeLayer(toMarker); if(routeLine) poolMap.removeLayer(routeLine);
    poolMap.setView(CENTER,6); document.getElementById("routeInfo").style.display="none";
  }catch(e){
    msg.textContent="Failed to create";
    showError("createError", "Error: "+e.message+"\n\nPayload was:\n"+JSON.stringify(payload,null,2)+"\n\nFix Firestore Rules in Firebase Console:\nrules_version = '2';\nservice cloud.firestore {\n match /databases/{database}/documents {\n match /{document=**} {\n allow read, write: if true;\n }\n }\n}");
  }
};

function startListeners(){
  if(!currentDriver) return;
  onSnapshot(query(collection(db,"pool_trips"), where("driverId","==",currentDriver.id), limit(20)), snap=>{
    const box=document.getElementById("myTripsBox");
    if(snap.size===0){ box.innerHTML='<div class="small">No trips</div>'; return; }
    const trips=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    box.innerHTML=trips.map(t=>`<div class="order"><b>${t.from} → ${t.to}</b><div class="small">${t.status} • ${t.joinedCount||0}/${t.totalSeats} • ${t.distance? t.distance.toFixed(1)+'km':''}</div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-ghost" style="flex:1;padding:6px;font-size:11px" onclick="cancelTrip('${t.id}')">CANCEL</button></div></div>`).join("");
  });
  onSnapshot(query(collection(db,"pool_requests"), where("driverId","==",currentDriver.id), limit(20)), snap=>{
    const box=document.getElementById("riderBox");
    if(snap.size===0){ box.innerHTML='<div class="small">No riders</div>'; return; }
    const rs=snap.docs.map(d=>({id:d.id,...d.data()}));
    box.innerHTML=rs.map(r=>`<div class="order"><b>${r.customerName||'Rider'} ${r.customerPhone||''}</b><div class="small">${r.customerPickup} → ${r.customerDropoff} • ₦${(r.fare||0).toLocaleString()} • OTP ${r.otp} • ${r.status}</div></div>`).join("");
  });
}
window.cancelTrip=async(id)=>{ if(confirm("Cancel trip?")) await updateDoc(doc(db,"pool_trips",id),{status:"cancelled"}); };
</script>
</body>
</html>
